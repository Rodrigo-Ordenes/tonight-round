name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    # Fijo en 24.04: ubuntu-latest pasó a 26.04 y Playwright 1.55 no instala Chromium ahí
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de lógica
        run: npm test
      - name: Tipos
        run: npx tsc --noEmit
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: E2E sobre el build de producción
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Reporte de E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
